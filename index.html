<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>The Last Ember</title>
		<link rel="preload" href="/assets/fonts/CormorantGaramond-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin>
		<link rel="stylesheet" href="/css/font.css">
		<link rel="icon" type="image/png" href="/favicon.png">
		<style>
			body { 
				margin: 0; 
				font-family: 'Cormorant Garamond', serif;
				overflow: hidden;
			}
			
			/* Start Screen Styles */
			#start-screen {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: rgba(0, 0, 0, 0.5);
				z-index: 1000;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				color: #fff;
			}
			
			#background-video {
				position: fixed;
				top: 0;
				left: 0;
				min-width: 100%;
				min-height: 100%;
				width: auto;
				height: auto;
				z-index: 999;
				object-fit: cover;
			}
			
			.game-title {
				font-size: 5rem;
				font-weight: bold;
				margin-bottom: 2rem;
				text-shadow: 0 0 10px rgba(255, 160, 0, 0.7);
				letter-spacing: 0.2rem;
				transform: translateY(-5vh);
			}
			
			.press-any-key {
				font-size: 1.8rem;
				letter-spacing: 0.1rem;
				animation: pulse 2s infinite;
			}
			
			.start-button {
				display: none;
				padding: 1rem 3rem;
				font-size: 1.8rem;
				background-color: transparent;
				color: #fff;
				border: 2px solid #fff;
				cursor: pointer;
				transition: all 0.3s ease;
			}
			
			.start-button:hover {
				background-color: rgba(255, 255, 255, 0.2);
				transform: scale(1.05);
				text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
				box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
			}
			
			/* Video Screen Styles */
			#video-screen {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: #000;
				z-index: 999;
				display: none;
				justify-content: center;
				align-items: center;
			}
			
			#intro-video {
				max-width: 90%;
				max-height: 80%;
			}
			
			.skip-message {
				position: absolute;
				bottom: 2rem;
				right: 2rem;
				color: #fff;
				font-size: 1.2rem;
				opacity: 0;
				transition: opacity 0.5s ease;
			}
			
			/* Animation */
			@keyframes pulse {
				0% { opacity: 0.4; }
				50% { opacity: 1; }
				100% { opacity: 0.4; }
			}
		</style>
	</head>
	<body>
		<!-- Start Screen -->
		<div id="start-screen">
			<h1 class="game-title">THE LAST EMBER</h1>
			<div class="press-any-key">PRESS ANY KEY TO CONTINUE</div>
			<button class="start-button">START GAME</button>
		</div>
		
		<!-- Background Video -->
		<video id="background-video" src="/assets/videos/Start Screen.mp4" autoplay loop muted playsinline></video>
		
		<!-- Video Screen -->
		<div id="video-screen">
			<video id="intro-video" src="/assets/videos/trailer.mov"></video>
			<div class="skip-message">press any key to skip</div>
		</div>
		
		<script type="module" src="/src/main.js"></script>
		
		<script>
			document.addEventListener('DOMContentLoaded', () => {
				const startScreen = document.getElementById('start-screen');
				const pressAnyKey = document.querySelector('.press-any-key');
				const startButton = document.querySelector('.start-button');
				const videoScreen = document.getElementById('video-screen');
				const introVideo = document.getElementById('intro-video');
				const skipMessage = document.querySelector('.skip-message');
				const backgroundVideo = document.getElementById('background-video');
				
				let firstKeyPressed = false;
				
				// Ensure background video starts playing
				backgroundVideo.play().catch(error => {
					console.warn('Background video autoplay failed:', error);
				});
				
				// Function to clean up video element to free memory
				function cleanupVideo() {
					// Stop video playback
					introVideo.pause();
					
					// Remove source and clear any buffered data
					introVideo.removeAttribute('src');
					introVideo.load();
					
					// Remove the video element from the DOM
					if (introVideo.parentNode) {
						introVideo.parentNode.removeChild(introVideo);
					}
					
					// Hide the video container
					videoScreen.style.display = 'none';
					
					// Clear any reference to the video in the global scope
					document.getElementById('intro-video') === null;
					
					// Force garbage collection if browser supports it
					if (window.gc) {
						window.gc();
					}
					
					console.log('Video element cleaned up and removed from memory');
				}
				
				// Function to clean up background video
				function cleanupBackgroundVideo() {
					// Stop video playback
					backgroundVideo.pause();
					
					// Remove source and clear any buffered data
					backgroundVideo.removeAttribute('src');
					backgroundVideo.load();
					
					console.log('Background video stopped and cleaned up');
				}
				
				// Function to start the ambient wind sound using the game's sound manager
				function startAmbientWind() {
					// Wait until the game has loaded and the sound manager is available
					const checkForSoundManager = () => {
						if (window.SOUND_MANAGER) {
							// Preload the wind sound if it wasn't already
							if (!window.SOUND_MANAGER.sounds['ambientWind']) {
								window.SOUND_MANAGER.preloadSound('ambientWind', '/assets/sounds/windBlowing.mp3');
							}
							
							// Start the wind sound loop
							window.SOUND_MANAGER.startLoop('ambientWind', { volume: 1.0 });
							console.log('Started ambient wind sound');
						} else {
							// If sound manager isn't available yet, check again in 100ms
							setTimeout(checkForSoundManager, 100);
						}
					};
					
					checkForSoundManager();
				}
				
				// Listen for any key press on the start screen
				document.addEventListener('keydown', function(event) {
					if (startScreen.style.display !== 'none' && !firstKeyPressed) {
						pressAnyKey.style.display = 'none';
						startButton.style.display = 'block';
						firstKeyPressed = true;
					} else if (startScreen.style.display !== 'none' && firstKeyPressed && event.key === 'Enter') {
						startGame();
					} else if (videoScreen.style.display === 'flex') {
						// Skip video if playing and key is pressed
						skipVideo();
					}
				});
				
				// Click event for start button
				startButton.addEventListener('click', startGame);
				
				function startGame() {
					// Hide the start screen first for immediate visual feedback
					startScreen.style.display = 'none';
					videoScreen.style.display = 'flex';
					
					// Clean up background video
					cleanupBackgroundVideo();
					
					// Start playing the intro video
					introVideo.play();
					
					// Show "press any key to skip" for 3 seconds
					skipMessage.style.opacity = '1';
					setTimeout(() => {
						skipMessage.style.opacity = '0';
					}, 3000);
					
					// When video ends, clean up video elements and start wind sound
					introVideo.addEventListener('ended', () => {
						cleanupVideo();
						startAmbientWind();
						removeUnusedDOMElements();
					});
				}
				
				function skipVideo() {
					cleanupVideo();
					startAmbientWind();
					removeUnusedDOMElements();
				}
				
				// Function to remove all unused DOM elements to free memory
				function removeUnusedDOMElements() {
					// Remove the start screen from the DOM
					if (startScreen && startScreen.parentNode) {
						startScreen.parentNode.removeChild(startScreen);
						console.log('Start screen removed from DOM');
					}
					
					// Remove the background video from the DOM
					if (backgroundVideo && backgroundVideo.parentNode) {
						backgroundVideo.parentNode.removeChild(backgroundVideo);
						console.log('Background video removed from DOM');
					}
					
					// Remove the video screen from the DOM
					if (videoScreen && videoScreen.parentNode) {
						videoScreen.parentNode.removeChild(videoScreen);
						console.log('Video screen removed from DOM');
					}
					
					// Clear references
					window.startScreen = null;
					window.backgroundVideo = null;
					window.videoScreen = null;
					
					// Force garbage collection if browser supports it
					if (window.gc) {
						window.gc();
					}
				}
			});
		</script>
	</body>
</html>

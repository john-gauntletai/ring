<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>The Last Ember</title>
		<link rel="preload" href="/assets/fonts/CormorantGaramond-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin>
		<link rel="stylesheet" href="/css/font.css">
		<link rel="icon" type="image/png" href="/favicon.png">
		<style>
			body { 
				margin: 0; 
				font-family: 'Cormorant Garamond', serif;
				overflow: hidden;
			}
			
			/* Start Screen Styles */
			#start-screen {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: rgba(0, 0, 0, 0.5);
				z-index: 1000;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				color: #fff;
			}
			
			#background-video {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				z-index: 999;
				object-fit: cover;
			}
			
			.game-title {
				font-size: 8rem;
				font-weight: bold;
				margin-bottom: 8rem;
				letter-spacing: 0.2rem;
				transform: translateY(-5vh);
				position: relative;
				display: inline-block;
				/* Remove outline from the main element and rely on layering */
				-webkit-text-stroke: 0px transparent;
				text-stroke: 0px transparent;
			}
			
			/* Create the main gold gradient text layer */
			.game-title::before {
				content: "THE LAST EMBER";
				position: absolute;
				left: 0;
				top: 0;
				z-index: 1; /* Top layer */
				background: linear-gradient(to bottom, #c4b08c 0%, #a17f4b 50%, #765a2c 100%);
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: transparent;
				-webkit-text-stroke: 0; /* No stroke on the gold gradient */
				text-stroke: 0;
			}
			
			/* Add cracked texture to the gold */
			.game-title-cracks {
				position: absolute;
				width: 100%;
				height: 100%;
				left: 0;
				top: 0;
				z-index: 2; /* Above the gold gradient */
				background-image: 
					/* Main jagged crack lines with varying opacity */
					linear-gradient(37deg, transparent 44%, rgba(0,0,0,0.7) 44.5%, rgba(0,0,0,0.7) 45.5%, transparent 46%),
					linear-gradient(143deg, transparent 45%, rgba(0,0,0,0.65) 46%, rgba(0,0,0,0.65) 46.8%, transparent 47.5%),
					linear-gradient(195deg, transparent 47%, rgba(0,0,0,0.6) 47.3%, rgba(0,0,0,0.6) 48.7%, transparent 49.5%),
					/* Secondary irregular cracks */
					linear-gradient(72deg, transparent 48.5%, rgba(0,0,0,0.5) 49%, transparent 49.8%),
					linear-gradient(108deg, transparent 46.7%, rgba(0,0,0,0.45) 47%, transparent 47.9%),
					/* Broken edges and fragments */
					radial-gradient(circle at 30% 45%, rgba(0,0,0,0.6) 0%, transparent 3%),
					radial-gradient(circle at 70% 65%, rgba(0,0,0,0.55) 0%, transparent 2%),
					/* Fine hairline cracks */
					linear-gradient(27deg, transparent 49.5%, rgba(0,0,0,0.4) 49.7%, transparent 50%),
					linear-gradient(159deg, transparent 49.6%, rgba(0,0,0,0.35) 49.8%, transparent 50.1%),
					/* Interconnecting cracks */
					linear-gradient(165deg, transparent 47.8%, rgba(0,0,0,0.5) 48%, rgba(0,0,0,0.5) 48.3%, transparent 48.7%),
					linear-gradient(85deg, transparent 48.9%, rgba(0,0,0,0.45) 49.1%, transparent 49.4%);
				background-size: 
					420px 420px, /* Main jagged cracks */
					380px 380px, 
					350px 350px,
					200px 200px, /* Secondary irregular cracks */
					250px 250px,
					70px 70px, /* Broken fragments */
					50px 50px,
					150px 150px, /* Fine hairline cracks */
					120px 120px,
					220px 220px, /* Interconnecting cracks */
					180px 180px;
				background-position: 
					-20px 15px, /* Main cracks - offset positions for randomness */
					80px 60px, 
					-30px 95px,
					65px 35px, /* Secondary cracks */
					-15px 60px,
					210px 140px, /* Broken fragments */
					310px 220px,
					50px 25px, /* Fine hairline cracks */
					80px 85px,
					-40px 130px, /* Interconnecting cracks */
					190px 10px;
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: transparent;
				opacity: 1;
				font-size: inherit;
				font-weight: inherit;
			}
			
			/* Add crack shadows for depth and broken edges effect */
			.game-title-cracks::after {
				content: "THE LAST EMBER";
				position: absolute;
				left: 0;
				top: 0;
				width: 100%;
				height: 100%;
				background-image: 
					/* Shadow effects for main cracks */
					linear-gradient(37deg, transparent 44.8%, rgba(255,220,150,0.3) 45%, transparent 45.2%),
					linear-gradient(143deg, transparent 45.8%, rgba(255,220,150,0.25) 46%, transparent 46.2%),
					/* Broken edge highlights */
					radial-gradient(circle at 30% 45%, rgba(255,220,150,0.4) 0%, transparent 2%),
					radial-gradient(circle at 70% 65%, rgba(255,220,150,0.35) 0%, transparent 1.5%),
					/* Rough texture in certain areas */
					repeating-linear-gradient(55deg, transparent, transparent 2px, rgba(255,220,150,0.15) 3px, transparent 4px),
					repeating-linear-gradient(135deg, transparent, transparent 2px, rgba(255,220,150,0.1) 3px, transparent 4px);
				background-size: 
					420px 420px,
					380px 380px,
					70px 70px,
					50px 50px,
					10px 10px,
					8px 8px;
				background-position: 
					-19px 16px, /* Slight offset for shadow */
					81px 61px,
					210px 140px,
					310px 220px,
					0 0,
					0 0;
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: transparent;
				opacity: 0.9;
			}
			
			/* Add extra shine highlights to enhance crack visibility */
			.game-title-shine {
				position: absolute;
				width: 100%;
				height: 100%;
				left: 0;
				top: 0;
				z-index: 4; /* Above all other effects */
				background-image: 
					/* Bright edge highlights for main cracks */
					linear-gradient(37deg, transparent 44.7%, rgba(255,255,255,0.5) 44.9%, transparent 45.1%),
					linear-gradient(143deg, transparent 45.7%, rgba(255,255,255,0.45) 45.9%, transparent 46.1%),
					linear-gradient(195deg, transparent 47.6%, rgba(255,255,255,0.4) 47.8%, transparent 48%),
					/* Shine on broken fragments */
					radial-gradient(circle at 30% 45%, rgba(255,255,255,0.6) 0%, transparent 1%),
					radial-gradient(circle at 70% 65%, rgba(255,255,255,0.5) 0%, transparent 0.7%),
					/* Subtle shimmer on some areas */
					linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
				background-size: 
					420px 420px,
					380px 380px,
					350px 350px,
					70px 70px,
					50px 50px,
					100% 100%;
				background-position: 
					-20px 15px,
					80px 60px,
					-30px 95px,
					210px 140px,
					310px 220px,
					0 0;
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: transparent;
				opacity: 0.85;
				font-size: inherit;
				font-weight: inherit;
			}
			
			/* Add age discoloration spots */
			.game-title-age {
				position: absolute;
				width: 100%;
				height: 100%;
				left: 0;
				top: 0;
				z-index: 3; /* Above the cracks */
				background: 
					radial-gradient(circle at 10% 20%, rgba(100,50,0,0.2) 0%, transparent 25%),
					radial-gradient(circle at 80% 40%, rgba(30,15,0,0.15) 0%, transparent 30%),
					radial-gradient(circle at 30% 70%, rgba(80,30,0,0.1) 0%, transparent 20%);
				background-size: 200px 200px, 150px 150px, 180px 180px;
				background-position: 30px 40px, 180px 50px, 100px 150px;
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: transparent;
				opacity: 0.6;
				font-size: inherit;
				font-weight: inherit;
			}
			
			/* Create thin black outline that shows behind the gold text */
			.game-title::after {
				content: "THE LAST EMBER";
				position: absolute;
				left: 0;
				top: 0;
				z-index: 0; /* Behind the gold gradient */
				color: black;
				-webkit-text-stroke: 1px black;
				text-stroke: 1px black;
				-webkit-text-fill-color: transparent;
			}
			
			/* Add burnt effect around the edges as a separate layer */
			.game-title-burnt {
				position: absolute;
				left: 0;
				top: 0;
				z-index: -1; /* Behind everything */
				width: 100%;
				height: 100%;
				font-size: inherit;
				font-weight: inherit;
				background: linear-gradient(to bottom, transparent 10%, #6e1c00 80%, #3b0d00 100%);
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: transparent;
				opacity: 0.65;
				transform: translateY(3px);
			}
			
			/* Add darker burnt layer with slight offset */
			.game-title-burnt::after {
				content: "THE LAST EMBER";
				position: absolute;
				left: 0.5px;
				top: 0.5px;
				width: 100%;
				height: 100%;
				background: linear-gradient(to bottom, #4d1800 0%, #2b0a00 100%);
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: transparent;
				opacity: 0.35;
			}
			
			/* Add additional charred texture effect */
			.game-title-burnt::before {
				content: "THE LAST EMBER";
				position: absolute;
				left: -1px;
				top: 3px;
				width: 100%;
				height: 100%;
				background: #000;
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: transparent;
				opacity: 0.2;
			}
			
			.press-any-key {
				font-size: 1rem;
				letter-spacing: 0.1rem;
				animation: pulse 2s infinite;
				position: relative;
				padding: 0.8rem 1.5rem;
				display: inline-block;
				z-index: 1;
				/* Use the lightest gold color from the title gradient */
				color: #c4b08c;
				/* Remove the gradient background and text-fill properties */
				text-shadow: 0 0 1px rgba(0, 0, 0, 0.5);
			}
			
			/* Create the pen stroke effect with a pseudo-element */
			.press-any-key::before {
				content: "";
				position: absolute;
				top: -10px;
				left: -15px;
				right: -15px;
				bottom: -10px;
				background: radial-gradient(ellipse at center, rgba(255, 180, 60, 0.25) 0%, rgba(245, 170, 50, 0.15) 60%, rgba(235, 160, 40, 0) 100%);
				z-index: -1;
				transform: none; /* Remove the rotation/skew that creates sharp edges */
				border-radius: 50%; /* Make it more circular/organic */
				filter: blur(10px); /* Add blur for cloud-like diffusion */
				box-shadow: 
					0 0 20px rgba(250, 190, 70, 0.2),
					0 0 35px rgba(240, 180, 50, 0.1); /* Multiple shadows for depth */
				animation: glowPulse 3s infinite ease-in-out;
				
				/* Remove the mask that was creating defined edges */
				-webkit-mask-image: none;
				mask-image: none;
			}
			
			/* Add a secondary glow layer for more cloud-like complexity */
			.press-any-key::after {
				content: "";
				position: absolute;
				top: -5px;
				left: -10px;
				right: -10px;
				bottom: -5px;
				background: radial-gradient(circle at 30% 40%, rgba(255, 200, 70, 0.2) 0%, rgba(250, 180, 60, 0.1) 40%, rgba(245, 170, 40, 0) 80%);
				z-index: -2;
				border-radius: 40% 60% 60% 40% / 60% 30% 70% 40%; /* Irregular shape */
				filter: blur(8px);
				animation: cloudMove 8s infinite alternate ease-in-out;
			}
			
			.start-button {
				display: none;
				padding: 0.8rem 3rem;
				font-size: 1rem;
				letter-spacing: 0.1rem;
				background-color: transparent;
				color: #c4b08c;
				border: none;
				cursor: pointer;
				transition: all 0.3s ease;
				position: relative;
				z-index: 1;
				text-shadow: 0 0 1px rgba(0, 0, 0, 0.5);
				font-family: 'Cormorant Garamond', serif;
			}
			
			/* Create the pen stroke effect with a pseudo-element for the button */
			.start-button::before {
				content: "";
				position: absolute;
				top: -10px;
				left: -15px;
				right: -15px;
				bottom: -10px;
				background: radial-gradient(ellipse at center, rgba(255, 180, 60, 0.25) 0%, rgba(245, 170, 50, 0.15) 60%, rgba(235, 160, 40, 0) 100%);
				z-index: -1;
				transform: none; /* Remove the rotation/skew that creates sharp edges */
				border-radius: 50%; /* Make it more circular/organic */
				filter: blur(10px); /* Add blur for cloud-like diffusion */
				box-shadow: 
					0 0 20px rgba(250, 190, 70, 0.2),
					0 0 35px rgba(240, 180, 50, 0.1); /* Multiple shadows for depth */
				animation: glowPulse 3s infinite ease-in-out;
				
				/* Remove the mask that was creating defined edges */
				-webkit-mask-image: none;
				mask-image: none;
			}
			
			/* Add a secondary glow layer for more cloud-like complexity for the button */
			.start-button::after {
				content: "";
				position: absolute;
				top: -5px;
				left: -10px;
				right: -10px;
				bottom: -5px;
				background: radial-gradient(circle at 30% 40%, rgba(255, 200, 70, 0.2) 0%, rgba(250, 180, 60, 0.1) 40%, rgba(245, 170, 40, 0) 80%);
				z-index: -2;
				border-radius: 40% 60% 60% 40% / 60% 30% 70% 40%; /* Irregular shape */
				filter: blur(8px);
				animation: cloudMove 8s infinite alternate ease-in-out;
			}
			
			.start-button:hover {
				transform: scale(1.05);
				text-shadow: 0 0 8px rgba(255, 220, 150, 0.7); /* Gold-tinted glow */
			}
			
			.start-button:hover::before {
				opacity: 0.8;
				box-shadow: 
					0 0 25px rgba(250, 190, 70, 0.3),
					0 0 40px rgba(245, 180, 60, 0.2); /* Enhanced glow on hover */
				filter: blur(8px); /* Slightly less blur for more intensity */
			}
			
			/* Video Screen Styles */
			#video-screen {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: #000;
				z-index: 999;
				display: none;
				justify-content: center;
				align-items: center;
			}
			
			#intro-video {
				max-width: 90%;
				max-height: 80%;
			}
			
			.skip-message {
				position: absolute;
				bottom: 2rem;
				right: 2rem;
				color: #fff;
				font-size: 1.2rem;
				opacity: 0;
				transition: opacity 0.5s ease;
			}
			
			/* Character Selection Screen Styles */
			#character-select-screen {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: linear-gradient(to bottom, #1a1a1a 0%, #000000 100%);
				z-index: 998;
				display: none;
				flex-direction: column;
				align-items: center;
				color: #fff;
				padding-top: calc(100px + 3vh); /* Increased by 5% of viewport height to move boxes lower */
			}
			
			.character-select-title {
				font-size: 1.5em; /* 50% smaller than previous 3em */
				letter-spacing: 0.1rem;
				color: #c4b08c;
				text-shadow: none; /* Removed glow effect */
				position: absolute;
				top: 30px;
				left: 30px;
				margin: 0;
			}
			
			.character-boxes {
				display: flex;
				justify-content: center;
				gap: 4rem;
				margin-bottom: 2rem;
				padding: 0 2rem;
				width: 100%;
				box-sizing: border-box;
			}
			
			.character-box {
				width: 36%; /* Reduced from 45% by 20% */
				max-width: 400px; /* Reduced from 500px by 20% */
				height: 57vh; /* Reduced from 63vh by 10% */
				max-height: 570px; /* Reduced from 630px by 10% */
				border: 2px solid #a17f4b;
				border-radius: 10px;
				background-color: rgba(0, 0, 0, 0.5);
				overflow: hidden;
				position: relative;
				cursor: pointer;
				transition: all 0.3s ease;
				display: flex;
				justify-content: center;
				align-items: flex-start; /* Align to top instead of center */
				padding-top: 5%; /* Add padding at top for image positioning */
			}
			
			.character-box:hover {
				transform: scale(1.05);
				border-color: #c4b08c;
				box-shadow: 0 0 20px rgba(196, 176, 140, 0.5);
			}
			
			.character-box.selected {
				border-color: #c4b08c;
				box-shadow: 0 0 30px rgba(196, 176, 140, 0.8);
			}
			
			.character-image {
				max-width: 120%; /* Increased from 108% to make image larger */
				max-height: 120%; /* Increased from 108% to make image larger */
				object-fit: contain;
				transform: translateY(-15%); /* Move image up by 15% of its height */
			}
			
			.character-name {
				position: absolute;
				bottom: 9%; /* Move up by ~15% of available space (from 0%) */
				left: 0;
				width: 100%;
				padding: 0.5rem 0; /* Reduced from 1rem to 0.5rem to decrease spacing */
				background-color: rgba(0, 0, 0, 0.7);
				text-align: center;
				font-size: 1.5rem;
				color: #c4b08c;
			}
			
			.select-character-button {
				padding: 0.8rem 3rem;
				font-size: 1.2rem;
				letter-spacing: 0.1rem;
				background-color: transparent;
				color: #c4b08c;
				border: none;
				cursor: pointer;
				transition: all 0.3s ease;
				position: relative;
				z-index: 2; /* Increased to be above the glow effect */
				text-shadow: 0 0 1px rgba(0, 0, 0, 0.5);
				font-family: 'Cormorant Garamond', serif;
				margin-top: 3vh; /* Added 20% of viewport height to move button lower */
			}
			
			/* Create the pen stroke effect with a pseudo-element for the button */
			.select-character-button::before {
				content: "";
				position: absolute;
				top: -10px;
				left: -15px;
				right: -15px;
				bottom: -10px;
				background: radial-gradient(ellipse at center, rgba(255, 180, 60, 0.25) 0%, rgba(245, 170, 50, 0.15) 60%, rgba(235, 160, 40, 0) 100%);
				z-index: -1; /* Behind the text */
				transform: none;
				border-radius: 50%;
				filter: blur(10px);
				box-shadow: 
					0 0 20px rgba(250, 190, 70, 0.2),
					0 0 35px rgba(240, 180, 50, 0.1);
				animation: glowPulse 3s infinite ease-in-out;
				
				-webkit-mask-image: none;
				mask-image: none;
			}
			
			/* Add a secondary glow layer for more cloud-like complexity for the button */
			.select-character-button::after {
				content: "";
				position: absolute;
				top: -5px;
				left: -10px;
				right: -10px;
				bottom: -5px;
				background: radial-gradient(circle at 30% 40%, rgba(255, 200, 70, 0.2) 0%, rgba(250, 180, 60, 0.1) 40%, rgba(245, 170, 40, 0) 80%);
				z-index: -2; /* Behind everything */
				border-radius: 40% 60% 60% 40% / 60% 30% 70% 40%;
				filter: blur(8px);
				animation: cloudMove 8s infinite alternate ease-in-out;
			}
			
			.select-character-button:hover {
				transform: scale(1.05);
				text-shadow: 0 0 8px rgba(255, 220, 150, 0.7); /* Gold-tinted glow */
			}
			
			.select-character-button:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}
			
			.select-character-button:disabled::before,
			.select-character-button:disabled::after {
				opacity: 0.3;
			}
			
			/* Animation */
			@keyframes pulse {
				0% { opacity: 0.4; }
				50% { opacity: 1; }
				100% { opacity: 0.4; }
			}
			
			/* New animation for the orangey glow effect */
			@keyframes glowPulse {
				0% { 
					opacity: 0.6; 
					box-shadow: 
						0 0 15px rgba(250, 190, 70, 0.15),
						0 0 30px rgba(245, 180, 60, 0.1); 
					background: radial-gradient(ellipse at center, rgba(255, 180, 60, 0.2) 0%, rgba(245, 170, 50, 0.1) 60%, rgba(235, 160, 40, 0) 100%);
				}
				50% { 
					opacity: 0.9; 
					box-shadow: 
						0 0 25px rgba(250, 190, 70, 0.25),
						0 0 40px rgba(245, 180, 60, 0.15); 
					background: radial-gradient(ellipse at center, rgba(255, 180, 60, 0.3) 0%, rgba(245, 170, 50, 0.15) 60%, rgba(235, 160, 40, 0) 100%);
				}
				100% { 
					opacity: 0.6; 
					box-shadow: 
						0 0 15px rgba(250, 190, 70, 0.15),
						0 0 30px rgba(245, 180, 60, 0.1); 
					background: radial-gradient(ellipse at center, rgba(255, 180, 60, 0.2) 0%, rgba(245, 170, 50, 0.1) 60%, rgba(235, 160, 40, 0) 100%);
				}
			}
			
			/* Add a subtle movement animation for the cloud effect */
			@keyframes cloudMove {
				0% {
					transform: translateX(-5px) scale(1);
					border-radius: 40% 60% 60% 40% / 60% 30% 70% 40%;
				}
				50% {
					transform: translateX(0px) scale(1.05);
					border-radius: 50% 50% 40% 60% / 40% 60% 40% 60%;
				}
				100% {
					transform: translateX(5px) scale(1);
					border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%;
				}
			}
			
			/* Location Overlay Styles */
			#location-overlay {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: transparent;
				z-index: 997;
				display: none;
				justify-content: center;
				align-items: center;
				opacity: 0;
				transition: opacity 2s ease;
			}
			
			.location-text-container {
				position: relative;
				width: 50%;
				padding: 15px 0;
				text-align: center;
				background-color: rgba(0, 0, 0, 0.5);
				/* Create fade effect on left and right edges */
				mask-image: linear-gradient(to right, transparent 0%, white 15%, white 85%, transparent 100%);
				-webkit-mask-image: linear-gradient(to right, transparent 0%, white 15%, white 85%, transparent 100%);
				/* Move 20% higher from the center */
				transform: translateY(-20vh);
			}
			
			.location-text {
				font-family: 'Cormorant Garamond', serif;
				font-size: 3.5rem;
				font-weight: 400;
				letter-spacing: 0.1rem;
				color: #fff;
				text-align: center;
				text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
				margin: 0;
				padding: 0.5rem 0;
				line-height: 1;
			}
			
			/* Enemy Felled Overlay Styles */
			#enemy-felled-overlay {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: transparent;
				z-index: 997;
				display: none;
				justify-content: center;
				align-items: center;
				opacity: 0;
				transition: opacity 1.5s ease;
			}
			
			.enemy-felled-container {
				position: relative;
				width: 50%;
				padding: 15px 0;
				text-align: center;
				background-color: rgba(0, 0, 0, 0.5);
				/* Create fade effect on left and right edges */
				mask-image: linear-gradient(to right, transparent 0%, white 15%, white 85%, transparent 100%);
				-webkit-mask-image: linear-gradient(to right, transparent 0%, white 15%, white 85%, transparent 100%);
				/* Move 20% higher from the center */
				transform: translateY(-20vh);
			}
			
			.enemy-felled-text {
				font-family: 'Cormorant Garamond', serif;
				font-size: 3.5rem;
				font-weight: 400;
				letter-spacing: 0.1rem;
				color: #fff;
				text-align: center;
				text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
				margin: 0;
				padding: 0.5rem 0;
				line-height: 1;
			}
		</style>
	</head>
	<body>
		<!-- Start Screen -->
		<div id="start-screen">
			<h1 class="game-title">
				<span class="game-title-burnt">THE LAST EMBER</span>
				<span class="game-title-cracks">THE LAST EMBER</span>
				<span class="game-title-age">THE LAST EMBER</span>
				<span class="game-title-shine">THE LAST EMBER</span>
				THE LAST EMBER
			</h1>
			<div class="press-any-key">PRESS ANY KEY TO CONTINUE</div>
			<button class="start-button">START GAME</button>
		</div>
		
		<!-- Background Video -->
		<video id="background-video" src="/assets/videos/Start Screen.mp4" autoplay loop muted playsinline></video>
		
		<!-- Video Screen -->
		<div id="video-screen">
			<video id="intro-video" src="/assets/videos/trailer.mov"></video>
			<div class="skip-message">press any key to skip</div>
		</div>
		
		<!-- Character Selection Screen -->
		<div id="character-select-screen">
			<h2 class="character-select-title">Select Character Base</h2>
			<div class="character-boxes">
				<div class="character-box" data-character="austen">
					<img src="/assets/images/austen.png" alt="Austen" class="character-image">
					<div class="character-name">Austen</div>
				</div>
				<div class="character-box" data-character="archer">
					<img src="/assets/images/archer.png" alt="Archer" class="character-image">
					<div class="character-name">Archer</div>
				</div>
			</div>
			<button class="select-character-button" disabled>SELECT CHARACTER</button>
		</div>
		
		<!-- Location Overlay -->
		<div id="location-overlay">
			<div class="location-text-container">
				<div class="location-text">Golden Grass Plains</div>
			</div>
		</div>
		
		<!-- Enemy Felled Overlay -->
		<div id="enemy-felled-overlay">
			<div class="enemy-felled-container">
				<div class="enemy-felled-text">ENEMY FELLED</div>
			</div>
		</div>
		
		<script type="module" src="/src/main.js"></script>
		
		<script>
			document.addEventListener('DOMContentLoaded', () => {
				const startScreen = document.getElementById('start-screen');
				const pressAnyKey = document.querySelector('.press-any-key');
				const startButton = document.querySelector('.start-button');
				const videoScreen = document.getElementById('video-screen');
				const introVideo = document.getElementById('intro-video');
				const skipMessage = document.querySelector('.skip-message');
				const backgroundVideo = document.getElementById('background-video');
				const characterSelectScreen = document.getElementById('character-select-screen');
				const characterBoxes = document.querySelectorAll('.character-box');
				const selectCharacterButton = document.querySelector('.select-character-button');
				const locationOverlay = document.getElementById('location-overlay');
				const enemyFelledOverlay = document.getElementById('enemy-felled-overlay');
				
				let firstKeyPressed = false;
				let selectedCharacter = null;
				
				// Ensure background video starts playing
				backgroundVideo.play().catch(error => {
					console.warn('Background video autoplay failed:', error);
				});
				
				// Function to clean up video element to free memory
				function cleanupVideo() {
					// Stop video playback
					introVideo.pause();
					
					// Remove source and clear any buffered data
					introVideo.removeAttribute('src');
					introVideo.load();
					
					// Remove the video element from the DOM
					if (introVideo.parentNode) {
						introVideo.parentNode.removeChild(introVideo);
					}
					
					// Hide the video container
					videoScreen.style.display = 'none';
					
					// Clear any reference to the video in the global scope
					document.getElementById('intro-video') === null;
					
					// Force garbage collection if browser supports it
					if (window.gc) {
						window.gc();
					}
					
					console.log('Video element cleaned up and removed from memory');
				}
				
				// Function to clean up background video
				function cleanupBackgroundVideo() {
					// Stop video playback
					backgroundVideo.pause();
					
					// Remove source and clear any buffered data
					backgroundVideo.removeAttribute('src');
					backgroundVideo.load();
					
					console.log('Background video stopped and cleaned up');
				}
				
				// Function to start the ambient wind sound using the game's sound manager
				function startAmbientWind() {
					// Wait until the game has loaded and the sound manager is available
					const checkForSoundManager = () => {
						if (window.SOUND_MANAGER) {
							// Preload the wind sound if it wasn't already
							if (!window.SOUND_MANAGER.sounds['ambientWind']) {
								window.SOUND_MANAGER.preloadSound('ambientWind', '/assets/sounds/windBlowing.mp3');
							}
							
							// Start the wind sound loop
							window.SOUND_MANAGER.startLoop('ambientWind', { volume: 1.0 });
							console.log('Started ambient wind sound');
						} else {
							// If sound manager isn't available yet, check again in 100ms
							setTimeout(checkForSoundManager, 100);
						}
					};
					
					checkForSoundManager();
				}
				
				// Function to play the new area sound using the game's sound manager
				function playNewAreaSound() {
					// Wait until the game has loaded and the sound manager is available
					const checkForSoundManager = () => {
						if (window.SOUND_MANAGER) {
							// Preload the new area sound if it wasn't already
							if (!window.SOUND_MANAGER.sounds['newArea']) {
								window.SOUND_MANAGER.preloadSound('newArea', '/assets/sounds/newArea.mp3');
							}
							
							// Play the sound (non-looping)
							window.SOUND_MANAGER.playSound('newArea', { volume: 0.2 });
							console.log('Played new area sound');
						} else {
							// If sound manager isn't available yet, check again in 100ms
							setTimeout(checkForSoundManager, 100);
						}
					};
					
					checkForSoundManager();
				}
				
				// Show character selection screen
				function showCharacterSelect() {
					characterSelectScreen.style.display = 'flex';
				}
				
				// Character selection
				characterBoxes.forEach(box => {
					box.addEventListener('click', () => {
						// Remove selected class from all boxes
						characterBoxes.forEach(b => b.classList.remove('selected'));
						
						// Add selected class to clicked box
						box.classList.add('selected');
						
						// Store selected character
						selectedCharacter = box.getAttribute('data-character');
						
						// Enable select button
						selectCharacterButton.disabled = false;
					});
				});
				
				// Character selection button
				selectCharacterButton.addEventListener('click', () => {
					if (selectedCharacter) {
						console.log(`Selected character: ${selectedCharacter}`);
						// Start the ambient wind sound when character is selected
						startAmbientWind();
						// Hide character select screen
						characterSelectScreen.style.display = 'none';
						
						// Show location overlay
						locationOverlay.style.display = 'flex';
						// Trigger a reflow before setting opacity for the transition to work
						locationOverlay.offsetHeight;
						// Make the overlay visible with transition
						locationOverlay.style.opacity = '1';
						
						// Play the new area sound when the location overlay appears
						playNewAreaSound();
						
						// Hide the overlay after 5 seconds
						setTimeout(() => {
							locationOverlay.style.opacity = '0';
							// Wait for the fade-out transition to complete before hiding the element
							setTimeout(() => {
								locationOverlay.style.display = 'none';
								// Here you would continue with the actual game initialization
							}, 2000); // 2 seconds for fade-out transition
						}, 3000); // Display for 3 seconds before starting fade-out
					}
				});
				
				// Listen for any key press on the start screen
				document.addEventListener('keydown', function(event) {
					if (startScreen.style.display !== 'none' && !firstKeyPressed) {
						pressAnyKey.style.display = 'none';
						startButton.style.display = 'block';
						firstKeyPressed = true;
					} else if (startScreen.style.display !== 'none' && firstKeyPressed && event.key === 'Enter') {
						startGame();
					} else if (videoScreen.style.display === 'flex') {
						// Skip video if playing and key is pressed
						skipVideo();
					}
				});
				
				// Click event for start button
				startButton.addEventListener('click', startGame);
				
				function startGame() {
					// Hide the start screen first for immediate visual feedback
					startScreen.style.display = 'none';
					videoScreen.style.display = 'flex';
					
					// Clean up background video
					cleanupBackgroundVideo();
					
					// Start playing the intro video
					introVideo.play();
					
					// Show "press any key to skip" for 3 seconds
					skipMessage.style.opacity = '1';
					setTimeout(() => {
						skipMessage.style.opacity = '0';
					}, 3000);
					
					// When video ends, clean up video elements and show character selection
					introVideo.addEventListener('ended', () => {
						cleanupVideo();
						removeUnusedDOMElements();
						showCharacterSelect();
					});
				}
				
				function skipVideo() {
					cleanupVideo();
					removeUnusedDOMElements();
					showCharacterSelect();
				}
				
				// Function to remove all unused DOM elements to free memory
				function removeUnusedDOMElements() {
					// Remove the start screen from the DOM
					if (startScreen && startScreen.parentNode) {
						startScreen.parentNode.removeChild(startScreen);
						console.log('Start screen removed from DOM');
					}
					
					// Remove the background video from the DOM
					if (backgroundVideo && backgroundVideo.parentNode) {
						backgroundVideo.parentNode.removeChild(backgroundVideo);
						console.log('Background video removed from DOM');
					}
					
					// Remove the video screen from the DOM
					if (videoScreen && videoScreen.parentNode) {
						videoScreen.parentNode.removeChild(videoScreen);
						console.log('Video screen removed from DOM');
					}
					
					// Clear references
					window.startScreen = null;
					window.backgroundVideo = null;
					window.videoScreen = null;
					
					// Force garbage collection if browser supports it
					if (window.gc) {
						window.gc();
					}
				}
			});
		</script>
	</body>
</html>
